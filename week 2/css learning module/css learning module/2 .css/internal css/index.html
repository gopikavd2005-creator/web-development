<!--Internal CSS is written inside the <style> tag in the <head> section of an HTML document.
It is used to style all matching elements on a single web page.-->
<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>
    <style>
        h1 {
            color: blue;
            text-align: center;
        }
        p {
            color: gray;
            font-size: 18px;
        }
        body {
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>Welcome to CSS.</p>
</body>
</html>
